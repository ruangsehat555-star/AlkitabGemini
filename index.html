<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1d3557" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Alkitab TB Suara</title>
  <link id="manifestLink" rel="manifest" />
  <link id="iconLink" rel="icon" type="image/png" />
  <link id="appleIconLink" rel="apple-touch-icon" />
  <style>
    :root {
      --bg: #f8f6f2;
      --card: #ffffff;
      --primary: #2b4c7e;
      --primary-dark: #1d3557;
      --accent: #d97706;
      --danger: #dc2626;
      --success: #059669;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 115px;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header p { font-size: 0.78rem; opacity: 0.88; margin-top: 2px; }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .icon-btn {
      background: rgba(255,255,255,0.16);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn.install-ready {
      background: var(--accent);
      border-color: var(--accent);
    }
    .container { max-width: 680px; margin: 0 auto; padding: 14px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.94rem;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); color: #fff; flex: 1; }
    .btn-outline {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-bar {
      font-size: 0.84rem;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #1e40af;
      margin-top: 10px;
      display: none;
      word-break: break-word;
    }
    .status-bar.active { display: block; }
    .status-bar.error { background: #fef2f2; color: #991b1b; }
    .status-bar.ok { background: #ecfdf5; color: #065f46; }
    .passage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .passage-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #1e3a8a;
    }
    .verse-item {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .verse-item:hover { background: #f9fafb; }
    .verse-item.highlight {
      background: #fef3c7;
      border-left: 4px solid var(--accent);
    }
    .verse-num {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.85rem;
      margin-right: 6px;
    }
    .verse-text { font-size: 1.05rem; }
    .fab-mic {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #fff;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(43, 76, 126, 0.38);
      z-index: 25;
      min-width: 230px;
    }
    .fab-mic.listening {
      background: var(--danger);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .speed-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.84rem;
    }
    .speed-row select { width: auto; padding: 6px 10px; font-size: 0.84rem; }
    .loader {
      text-align: center;
      padding: 24px 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .nav-pasal-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Alkitab TB Suara</h1>
    <p>Perintah Suara &amp; Pembaca Ayat (66 Kitab)</p>
  </div>
  <div class="header-actions">
    <button class="icon-btn install-ready" id="btnInstall" style="display:none;" onclick="triggerInstall()">&#128242; Instal</button>
  </div>
</header>

<div class="container">
  <!-- Navigasi Kitab, Pasal, Ayat -->
  <div class="card">
    <div class="controls-grid">
      <div>
        <label for="testamentSelect">Kategori Perjanjian</label>
        <select id="testamentSelect">
          <option value="ALL" selected>Semua Kitab (66)</option>
          <option value="OT">Perjanjian Lama (39)</option>
          <option value="NT">Perjanjian Baru (27)</option>
        </select>
      </div>
      <div>
        <label for="bookSelect">Pilih Kitab</label>
        <select id="bookSelect"></select>
      </div>
      <div>
        <label for="chapterSelect">Pasal</label>
        <select id="chapterSelect"></select>
      </div>
      <div>
        <label for="verseSelect">Ayat (Opsional)</label>
        <select id="verseSelect"></select>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-accent" id="btnRead" onclick="readPassage()">&#128266; Bacakan</button>
      <button class="btn-outline" id="btnStop" onclick="stopReading()">&#9209; Berhenti</button>
    </div>

    <div class="speed-row">
      <span>Kecepatan Suara:</span>
      <select id="rateSelect">
        <option value="0.85">0.85x (Lebih Pelan)</option>
        <option value="1" selected>1.0x (Normal)</option>
        <option value="1.15">1.15x (Agak Cepat)</option>
      </select>
    </div>

    <div id="statusBar" class="status-bar"></div>
  </div>

  <!-- Tampilan Ayat -->
  <div class="card">
    <div class="passage-header">
      <div>
        <div class="passage-title" id="passageTitle">Yohanes 3</div>
        <span class="badge" id="testamentBadge">Perjanjian Baru</span>
      </div>
      <span style="font-size:0.76rem; color:var(--muted);">Ketuk ayat untuk menandai</span>
    </div>

    <div id="versesContainer">
      <div class="loader">Memuat ayat...</div>
    </div>

    <div class="nav-pasal-row">
      <button class="btn-outline" style="flex:1;" onclick="prevChapter()">&larr; Pasal Sebelumnya</button>
      <button class="btn-outline" style="flex:1;" onclick="nextChapter()">Pasal Berikutnya &rarr;</button>
    </div>
  </div>
</div>

<!-- Tombol Mikrofon Mengambang -->
<button class="fab-mic" id="btnMic" onclick="toggleListening()">
  &#127908; Perintah Suara
</button>

<script>
  // =========================================================
  // 1. SETUP PWA (MANIFEST & SERVICE WORKER)
  // =========================================================
  (function setupPWA() {
    try {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="110" fill="#1d3557"/>
        <rect x="126" y="96" width="260" height="320" rx="24" fill="#f8f6f2"/>
        <rect x="126" y="96" width="36" height="320" rx="10" fill="#d97706"/>
        <path d="M266 165v130M220 210h92" stroke="#1d3557" stroke-width="24" stroke-linecap="round"/>
      </svg>`;
      const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon);
      document.getElementById("iconLink").href = iconUrl;
      document.getElementById("appleIconLink").href = iconUrl;

      const manifest = {
        name: "Alkitab TB Suara",
        short_name: "Alkitab TB",
        description: "Aplikasi Alkitab Terjemahan Baru dengan perintah suara dan pembaca ayat",
        start_url: "./",
        scope: "./",
        display: "standalone",
        background_color: "#f8f6f2",
        theme_color: "#1d3557",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      document.getElementById("manifestLink").href = URL.createObjectURL(manifestBlob);

      if ("serviceWorker" in navigator) {
        const swCode = `
          const CACHE_NAME = 'alkitab-tb-v7';
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            if (e.request.url.includes('/api/')) return;
            e.respondWith(
              fetch(e.request).then(res => {
                const clone = res.clone();
                caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));
                return res;
              }).catch(() => caches.match(e.request))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "application/javascript" });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    } catch (e) {}
  })();

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById("btnInstall").style.display = "inline-flex";
  });

  async function triggerInstall() {
    if (!deferredInstallPrompt) {
      showStatus("Untuk menginstal: ketuk menu titik tiga (⋮) di Chrome HP lalu pilih 'Tambahkan ke layar utama' / 'Instal aplikasi'.");
      return;
    }
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === "accepted") {
      document.getElementById("btnInstall").style.display = "none";
    }
    deferredInstallPrompt = null;
  }

  // =========================================================
  // 2. DAFTAR LENGKAP 66 KITAB ALKITAB (PL & PB)
  // =========================================================
  const BOOKS = [
    // Perjanjian Lama (39 Kitab)
    { id: "kej", name: "Kejadian", testament: "OT", chapters: 50, aliases: ["kejadian"] },
    { id: "kel", name: "Keluaran", testament: "OT", chapters: 40, aliases: ["keluaran"] },
    { id: "ima", name: "Imamat", testament: "OT", chapters: 27, aliases: ["imamat"] },
    { id: "bil", name: "Bilangan", testament: "OT", chapters: 36, aliases: ["bilangan"] },
    { id: "ula", name: "Ulangan", testament: "OT", chapters: 34, aliases: ["ulangan"] },
    { id: "yos", name: "Yosua", testament: "OT", chapters: 24, aliases: ["yosua"] },
    { id: "hak", name: "Hakim-hakim", testament: "OT", chapters: 21, aliases: ["hakim-hakim", "hakim hakim", "hakim"] },
    { id: "rut", name: "Rut", testament: "OT", chapters: 4, aliases: ["rut", "ruth"] },
    { id: "1sa", name: "1 Samuel", testament: "OT", chapters: 31, aliases: ["1 samuel", "satu samuel", "pertama samuel"] },
    { id: "2sa", name: "2 Samuel", testament: "OT", chapters: 24, aliases: ["2 samuel", "dua samuel", "kedua samuel"] },
    { id: "1ra", name: "1 Raja-raja", testament: "OT", chapters: 22, aliases: ["1 raja-raja", "1 raja raja", "satu raja-raja", "satu raja raja"] },
    { id: "2ra", name: "2 Raja-raja", testament: "OT", chapters: 25, aliases: ["2 raja-raja", "2 raja raja", "dua raja-raja", "dua raja raja"] },
    { id: "1ta", name: "1 Tawarikh", testament: "OT", chapters: 29, aliases: ["1 tawarikh", "satu tawarikh"] },
    { id: "2ta", name: "2 Tawarikh", testament: "OT", chapters: 36, aliases: ["2 tawarikh", "dua tawarikh"] },
    { id: "ezr", name: "Ezra", testament: "OT", chapters: 10, aliases: ["ezra"] },
    { id: "neh", name: "Nehemia", testament: "OT", chapters: 13, aliases: ["nehemia"] },
    { id: "est", name: "Ester", testament: "OT", chapters: 10, aliases: ["ester", "esther"] },
    { id: "ayb", name: "Ayub", testament: "OT", chapters: 42, aliases: ["ayub"] },
    { id: "mzm", name: "Mazmur", testament: "OT", chapters: 150, aliases: ["mazmur"] },
    { id: "ams", name: "Amsal", testament: "OT", chapters: 31, aliases: ["amsal"] },
    { id: "pkh", name: "Pengkhotbah", testament: "OT", chapters: 12, aliases: ["pengkhotbah", "pengkotbah"] },
    { id: "kid", name: "Kidung Agung", testament: "OT", chapters: 8, aliases: ["kidung agung", "kidung"] },
    { id: "yes", name: "Yesaya", testament: "OT", chapters: 66, aliases: ["yesaya"] },
    { id: "yer", name: "Yeremia", testament: "OT", chapters: 52, aliases: ["yeremia"] },
    { id: "rat", name: "Ratapan", testament: "OT", chapters: 5, aliases: ["ratapan"] },
    { id: "yeh", name: "Yehezkiel", testament: "OT", chapters: 48, aliases: ["yehezkiel"] },
    { id: "dan", name: "Daniel", testament: "OT", chapters: 12, aliases: ["daniel"] },
    { id: "hos", name: "Hosea", testament: "OT", chapters: 14, aliases: ["hosea"] },
    { id: "yoe", name: "Yoel", testament: "OT", chapters: 3, aliases: ["yoel"] },
    { id: "amo", name: "Amos", testament: "OT", chapters: 9, aliases: ["amos"] },
    { id: "oba", name: "Obaja", testament: "OT", chapters: 1, aliases: ["obaja"] },
    { id: "yun", name: "Yunus", testament: "OT", chapters: 4, aliases: ["yunus"] },
    { id: "mik", name: "Mikha", testament: "OT", chapters: 7, aliases: ["mikha", "mika"] },
    { id: "nah", name: "Nahum", testament: "OT", chapters: 3, aliases: ["nahum"] },
    { id: "hab", name: "Habakuk", testament: "OT", chapters: 3, aliases: ["habakuk"] },
    { id: "zef", name: "Zefanya", testament: "OT", chapters: 3, aliases: ["zefanya"] },
    { id: "hag", name: "Hagai", testament: "OT", chapters: 2, aliases: ["hagai"] },
    { id: "zak", name: "Zakharia", testament: "OT", chapters: 14, aliases: ["zakharia", "zakaria"] },
    { id: "mal", name: "Maleakhi", testament: "OT", chapters: 4, aliases: ["maleakhi", "maleaki"] },

    // Perjanjian Baru (27 Kitab)
    { id: "mat", name: "Matius", testament: "NT", chapters: 28, aliases: ["matius"] },
    { id: "mrk", name: "Markus", testament: "NT", chapters: 16, aliases: ["markus"] },
    { id: "luk", name: "Lukas", testament: "NT", chapters: 24, aliases: ["lukas"] },
    { id: "yoh", name: "Yohanes", testament: "NT", chapters: 21, aliases: ["yohanes"] },
    { id: "kis", name: "Kisah Para Rasul", testament: "NT", chapters: 28, aliases: ["kisah para rasul", "kisah rasul"] },
    { id: "rom", name: "Roma", testament: "NT", chapters: 16, aliases: ["roma"] },
    { id: "1ko", name: "1 Korintus", testament: "NT", chapters: 16, aliases: ["1 korintus", "satu korintus"] },
    { id: "2ko", name: "2 Korintus", testament: "NT", chapters: 13, aliases: ["2 korintus", "dua korintus"] },
    { id: "gal", name: "Galatia", testament: "NT", chapters: 6, aliases: ["galatia"] },
    { id: "efe", name: "Efesus", testament: "NT", chapters: 6, aliases: ["efesus"] },
    { id: "flp", name: "Filipi", testament: "NT", chapters: 4, aliases: ["filipi"] },
    { id: "kol", name: "Kolose", testament: "NT", chapters: 4, aliases: ["kolose"] },
    { id: "1te", name: "1 Tesalonika", testament: "NT", chapters: 5, aliases: ["1 tesalonika", "satu tesalonika"] },
    { id: "2te", name: "2 Tesalonika", testament: "NT", chapters: 3, aliases: ["2 tesalonika", "dua tesalonika"] },
    { id: "1ti", name: "1 Timotius", testament: "NT", chapters: 6, aliases: ["1 timotius", "satu timotius"] },
    { id: "2ti", name: "2 Timotius", testament: "NT", chapters: 4, aliases: ["2 timotius", "dua timotius"] },
    { id: "tit", name: "Titus", testament: "NT", chapters: 3, aliases: ["titus"] },
    { id: "flm", name: "Filemon", testament: "NT", chapters: 1, aliases: ["filemon"] },
    { id: "ibr", name: "Ibrani", testament: "NT", chapters: 13, aliases: ["ibrani"] },
    { id: "yak", name: "Yakobus", testament: "NT", chapters: 5, aliases: ["yakobus"] },
    { id: "1pt", name: "1 Petrus", testament: "NT", chapters: 5, aliases: ["1 petrus", "satu petrus"] },
    { id: "2pt", name: "2 Petrus", testament: "NT", chapters: 3, aliases: ["2 petrus", "dua petrus"] },
    { id: "1yo", name: "1 Yohanes", testament: "NT", chapters: 5, aliases: ["1 yohanes", "satu yohanes"] },
    { id: "2yo", name: "2 Yohanes", testament: "NT", chapters: 1, aliases: ["2 yohanes", "dua yohanes"] },
    { id: "3yo", name: "3 Yohanes", testament: "NT", chapters: 1, aliases: ["3 yohanes", "tiga yohanes"] },
    { id: "yud", name: "Yudas", testament: "NT", chapters: 1, aliases: ["yudas"] },
    { id: "why", name: "Wahyu", testament: "NT", chapters: 22, aliases: ["wahyu"] }
  ];

  // =========================================================
  // 3. STATE & ELEMEN DOM
  // =========================================================
  let currentBookId = "yoh";
  let currentChapter = 3;
  let highlightedVerse = null;
  let currentVersesMap = {};
  let isListening = false;
  let recognition = null;

  const testamentSelect = document.getElementById("testamentSelect");
  const bookSelect = document.getElementById("bookSelect");
  const chapterSelect = document.getElementById("chapterSelect");
  const verseSelect = document.getElementById("verseSelect");
  const versesContainer = document.getElementById("versesContainer");
  const passageTitle = document.getElementById("passageTitle");
  const testamentBadge = document.getElementById("testamentBadge");
  const statusBar = document.getElementById("statusBar");
  const btnMic = document.getElementById("btnMic");

  function showStatus(msg, type = "info") {
    statusBar.textContent = msg;
    statusBar.className = "status-bar active" + (type === "error" ? " error" : type === "ok" ? " ok" : "");
  }

  // =========================================================
  // 4. DROPDOWN FILTER PERJANJIAN, KITAB, PASAL, AYAT
  // =========================================================
  function getBookById(id) {
    return BOOKS.find(b => b.id === id) || BOOKS[0];
  }

  function populateBooksDropdown() {
    const filter = testamentSelect.value;
    const filtered = BOOKS.filter(b => filter === "ALL" || b.testament === filter);

    bookSelect.innerHTML = "";
    filtered.forEach(b => {
      const opt = document.createElement("option");
      opt.value = b.id;
      opt.textContent = b.name;
      bookSelect.appendChild(opt);
    });

    if (!filtered.some(b => b.id === currentBookId)) {
      currentBookId = filtered[0].id;
      currentChapter = 1;
      highlightedVerse = null;
    }
    bookSelect.value = currentBookId;
    populateChaptersDropdown();
  }

  function populateChaptersDropdown() {
    const book = getBookById(currentBookId);
    chapterSelect.innerHTML = "";
    for (let i = 1; i <= book.chapters; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = "Pasal " + i;
      chapterSelect.appendChild(opt);
    }
    if (currentChapter > book.chapters || currentChapter < 1) {
      currentChapter = 1;
    }
    chapterSelect.value = currentChapter;
    fetchPassage();
  }

  function populateVersesDropdown() {
    verseSelect.innerHTML = '<option value="">Semua Ayat</option>';
    const verseNums = Object.keys(currentVersesMap).sort((a, b) => Number(a) - Number(b));
    verseNums.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = "Ayat " + v;
      verseSelect.appendChild(opt);
    });
    if (highlightedVerse && currentVersesMap[String(highlightedVerse)]) {
      verseSelect.value = String(highlightedVerse);
    } else {
      highlightedVerse = null;
      verseSelect.value = "";
    }
  }

  testamentSelect.addEventListener("change", populateBooksDropdown);
  bookSelect.addEventListener("change", () => {
    currentBookId = bookSelect.value;
    currentChapter = 1;
    highlightedVerse = null;
    populateChaptersDropdown();
  });
  chapterSelect.addEventListener("change", () => {
    currentChapter = Number(chapterSelect.value);
    highlightedVerse = null;
    fetchPassage();
  });
  verseSelect.addEventListener("change", () => {
    highlightedVerse = verseSelect.value ? Number(verseSelect.value) : null;
    renderPassage();
  });

  function prevChapter() {
    if (currentChapter > 1) {
      currentChapter--;
      highlightedVerse = null;
      chapterSelect.value = currentChapter;
      fetchPassage();
    }
  }

  function nextChapter() {
    const book = getBookById(currentBookId);
    if (currentChapter < book.chapters) {
      currentChapter++;
      highlightedVerse = null;
      chapterSelect.value = currentChapter;
      fetchPassage();
    }
  }

  // =========================================================
  // 5. AMBIL DATA AYAT LEWAT SERVERLESS FUNCTION VERCEL (/api/alkitab)
  // =========================================================
  function formatErrorMessage(errObj, fallbackStatus) {
    if (!errObj) return fallbackStatus;
    if (typeof errObj === "string") return errObj;
    if (typeof errObj.error === "string") return errObj.error;
    if (errObj.error && typeof errObj.error.message === "string") return errObj.error.message;
    if (typeof errObj.message === "string") return errObj.message;
    try {
      return JSON.stringify(errObj);
    } catch (_) {
      return fallbackStatus;
    }
  }

  async function fetchPassage(autoReadAfter = false) {
    const book = getBookById(currentBookId);
    passageTitle.textContent = `${book.name} ${currentChapter}` + (highlightedVerse ? `:${highlightedVerse}` : "");
    testamentBadge.textContent = book.testament === "OT" ? "Perjanjian Lama" : "Perjanjian Baru";

    const cacheKey = `tb_cache_${book.id}_${currentChapter}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try {
        currentVersesMap = JSON.parse(cached);
        populateVersesDropdown();
        renderPassage();
        if (autoReadAfter) setTimeout(readPassage, 250);
        return;
      } catch (e) {}
    }

    versesContainer.innerHTML = `<div class="loader">Memuat ${book.name} pasal ${currentChapter}...</div>`;

    try {
      const url = `/api/alkitab?kitab=${encodeURIComponent(book.name)}&pasal=${currentChapter}`;
      const res = await fetch(url, { headers: { "Accept": "application/json" } });
      const rawText = await res.text();
      let json = null;
      try { json = JSON.parse(rawText); } catch (_) {}

      if (!res.ok) {
        const errDetail = json
          ? formatErrorMessage(json, `HTTP ${res.status}`)
          : `HTTP ${res.status} - Fungsi /api/alkitab tidak ditemukan atau gagal merespons`;
        versesContainer.innerHTML = `<div class="loader" style="color:#991b1b;">Gagal memuat ayat: ${errDetail}. Pastikan <strong>api/alkitab.js</strong> ter-deploy dan <strong>ALKITAB_API_KEY</strong> sudah diatur lalu di-Redeploy.</div>`;
        return;
      }

      if (!json) {
        versesContainer.innerHTML = `<div class="loader" style="color:#991b1b;">Respon server bukan JSON. Pastikan folder <strong>api/alkitab.js</strong> aktif di Vercel.</div>`;
        return;
      }

      const parsedMap = extractVersesFromResponse(json);

      if (parsedMap && Object.keys(parsedMap).length > 0) {
        currentVersesMap = parsedMap;
        try { localStorage.setItem(cacheKey, JSON.stringify(parsedMap)); } catch (e) {}
        populateVersesDropdown();
        renderPassage();
        if (autoReadAfter) setTimeout(readPassage, 250);
      } else {
        versesContainer.innerHTML = `<div class="loader" style="color:#991b1b;">Data ayat kosong atau format respon tidak dikenali.</div>`;
      }
    } catch (err) {
      versesContainer.innerHTML = `<div class="loader" style="color:#991b1b;">Gagal menghubungi server (/api/alkitab): ${err && err.message ? err.message : "Periksa koneksi internet"}.</div>`;
    }
  }

  function extractVersesFromResponse(json) {
    const map = {};
    const list =
      Array.isArray(json) ? json :
      Array.isArray(json.data) ? json.data :
      Array.isArray(json.verses) ? json.verses :
      Array.isArray(json.ayat) ? json.ayat :
      (json.data && Array.isArray(json.data.verses)) ? json.data.verses :
      (json.data && Array.isArray(json.data.ayat)) ? json.data.ayat :
      null;

    if (list) {
      list.forEach((item, idx) => {
        const num = item.ayat || item.verse || item.number || item.no || (idx + 1);
        const text = item.firman || item.teks || item.text || item.content || item.isi || "";
        if (text) map[String(num)] = String(text).trim();
      });
    } else if (json && typeof json === "object") {
      const obj = json.data && typeof json.data === "object" ? json.data : json;
      Object.entries(obj).forEach(([k, v]) => {
        if (/^\d+$/.test(k) && typeof v === "string") {
          map[k] = v.trim();
        }
      });
    }
    return map;
  }

  function renderPassage() {
    const book = getBookById(currentBookId);
    passageTitle.textContent = `${book.name} ${currentChapter}` + (highlightedVerse ? `:${highlightedVerse}` : "");
    versesContainer.innerHTML = "";

    const verseNums = Object.keys(currentVersesMap).sort((a, b) => Number(a) - Number(b));
    if (verseNums.length === 0) {
      versesContainer.innerHTML = `<div class="loader">Tidak ada ayat ditemukan.</div>`;
      return;
    }

    verseNums.forEach(vNum => {
      const div = document.createElement("div");
      div.className = "verse-item" + (String(highlightedVerse) === String(vNum) ? " highlight" : "");
      div.id = "verse-" + vNum;
      div.onclick = () => {
        highlightedVerse = Number(vNum);
        verseSelect.value = vNum;
        renderPassage();
      };
      div.innerHTML = `<span class="verse-num">${vNum}</span><span class="verse-text">${currentVersesMap[vNum]}</span>`;
      versesContainer.appendChild(div);
    });

    if (highlightedVerse) {
      const target = document.getElementById("verse-" + highlightedVerse);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  // =========================================================
  // 6. PEMBACA AYAT (TEXT-TO-SPEECH) DENGAN PELAFALAN "ALLAH"
  // =========================================================
  function normalizeSpeechText(str) {
    return str.replace(/\bAllah\b/gi, "Al-lah");
  }

  function readPassage() {
    if (!("speechSynthesis" in window)) {
      showStatus("Browser ini belum mendukung fitur pembacaan suara.", "error");
      return;
    }
    window.speechSynthesis.cancel();

    const book = getBookById(currentBookId);
    const rate = parseFloat(document.getElementById("rateSelect").value) || 1.0;

    let textToRead = `${book.name} pasal ${currentChapter}. `;
    if (highlightedVerse && currentVersesMap[String(highlightedVerse)]) {
      textToRead += `Ayat ${highlightedVerse}. ${currentVersesMap[String(highlightedVerse)]}`;
    } else {
      const verseNums = Object.keys(currentVersesMap).sort((a, b) => Number(a) - Number(b));
      if (verseNums.length === 0) {
        showStatus("Belum ada teks ayat untuk dibacakan.", "error");
        return;
      }
      verseNums.forEach(vNum => {
        textToRead += `Ayat ${vNum}. ${currentVersesMap[vNum]} `;
      });
    }
    textToRead = normalizeSpeechText(textToRead);

    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.lang = "id-ID";
    utterance.rate = rate;

    utterance.onstart = () => showStatus("Sedang membacakan: " + passageTitle.textContent);
    utterance.onend = () => showStatus("Selesai membacakan.");
    utterance.onerror = () => showStatus("Gagal membacakan suara. Pastikan suara Bahasa Indonesia aktif di pengaturan HP.", "error");

    window.speechSynthesis.speak(utterance);
  }

  function stopReading() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      showStatus("Pembacaan dihentikan.");
    }
  }

  // =========================================================
  // 7. PERINTAH SUARA (SPEECH-TO-TEXT UNTUK 66 KITAB)
  // =========================================================
  function setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showStatus("Perintah suara belum didukung di browser ini. Gunakan Google Chrome di Android.", "error");
      return null;
    }

    const rec = new SpeechRecognition();
    rec.lang = "id-ID";
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      isListening = true;
      btnMic.classList.add("listening");
      btnMic.innerHTML = "&#128308; Mendengarkan...";
      showStatus("Silakan ucapkan kitab, pasal, dan ayat...");
    };

    rec.onend = () => {
      isListening = false;
      btnMic.classList.remove("listening");
      btnMic.innerHTML = "&#127908; Perintah Suara";
    };

    rec.onerror = (e) => {
      showStatus("Mikrofon tidak menangkap suara (" + e.error + "). Pastikan izin mikrofon aktif.", "error");
    };

    rec.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      showStatus(`Terdengar: "${transcript}"`);
      processVoiceCommand(transcript);
    };

    return rec;
  }

  function toggleListening() {
    stopReading();
    if (!recognition) {
      recognition = setupSpeechRecognition();
    }
    if (!recognition) return;

    if (isListening) {
      recognition.stop();
    } else {
      try {
        recognition.start();
      } catch (err) {
        showStatus("Sedang memproses mikrofon, coba tekan lagi.", "error");
      }
    }
  }

  function normalizeSpokenNumbers(text) {
    return text
      .replace(/\bpertama\b/g, "1")
      .replace(/\bsatu\b/g, "1")
      .replace(/\bkedua\b/g, "2")
      .replace(/\bdua\b/g, "2")
      .replace(/\bketiga\b/g, "3")
      .replace(/\btiga\b/g, "3");
  }

  function processVoiceCommand(rawText) {
    let text = normalizeSpokenNumbers(rawText.toLowerCase().trim());

    if (text.includes("berhenti") || text.includes("stop") || text.includes("diam")) {
      stopReading();
      return;
    }
    if (text === "bacakan" || text === "baca") {
      readPassage();
      return;
    }

    let matchedBook = null;
    let matchedAlias = "";

    const candidates = [];
    BOOKS.forEach(b => {
      b.aliases.forEach(alias => candidates.push({ book: b, alias }));
    });
    candidates.sort((a, b) => b.alias.length - a.alias.length);

    for (const item of candidates) {
      if (text.includes(item.alias)) {
        matchedBook = item.book;
        matchedAlias = item.alias;
        break;
      }
    }

    if (!matchedBook) {
      showStatus(`Kitab tidak dikenali dari ucapan: "${rawText}".`, "error");
      return;
    }

    const afterBookText = text.replace(matchedAlias, " ");
    const numbers = afterBookText.match(/\d+/g);

    let targetChapter = 1;
    let targetVerse = null;

    if (numbers && numbers.length >= 1) {
      const chCandidate = Number(numbers[0]);
      if (chCandidate >= 1 && chCandidate <= matchedBook.chapters) {
        targetChapter = chCandidate;
      }
    }
    if (numbers && numbers.length >= 2) {
      targetVerse = Number(numbers[1]);
    }

    if (testamentSelect.value !== "ALL" && testamentSelect.value !== matchedBook.testament) {
      testamentSelect.value = "ALL";
      populateBooksDropdown();
    }

    currentBookId = matchedBook.id;
    currentChapter = targetChapter;
    highlightedVerse = targetVerse;

    bookSelect.value = currentBookId;
    populateChaptersDropdown();

    const shouldRead = text.includes("baca");
    if (shouldRead) {
      setTimeout(readPassage, 400);
    }
  }

  populateBooksDropdown();
</script>
